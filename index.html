<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudarshan Net — Ancient Wisdom. Future Intelligence.</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-obsidian: #08090d;
      --bg-surface: #11131c;
      --bg-card: rgba(20, 23, 34, 0.72);
      --gold-primary: #e0b84c;
      --gold-glow: rgba(224, 184, 76, 0.25);
      --saffron: #f26b3a;
      --text-main: #f4f1ea;
      --text-muted: #9ea4b8;
      --border-subtle: rgba(224, 184, 76, 0.18);
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-obsidian);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(224, 184, 76, 0.08), transparent 35%),
        radial-gradient(circle at 85% 40%, rgba(242, 107, 58, 0.06), transparent 40%);
    }

    h1, h2, h3, .brand-font {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.03em;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(8, 9, 13, 0.8);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--gold-primary);
      font-weight: 800;
      font-size: 1.2rem;
    }

    .logo-ring {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      display: grid;
      place-items: center;
      box-shadow: 0 0 15px var(--gold-glow);
      animation: spinSlow 24s linear infinite;
    }

    @keyframes spinSlow { 100% { transform: rotate(360deg); } }

    nav { display: flex; gap: 1.75rem; align-items: center; }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--gold-primary); }

    /* Hero Section */
    .hero {
      position: relative;
      max-width: 1240px;
      margin: 0 auto;
      padding: 5rem 1.5rem 4rem;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 3rem;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      background: rgba(224, 184, 76, 0.1);
      border: 1px solid var(--border-subtle);
      color: var(--gold-primary);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 1.25rem;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 4.5vw, 3.8rem);
      line-height: 1.12;
      margin-bottom: 1.25rem;
      background: linear-gradient(135deg, #ffffff 30%, var(--gold-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 580px;
      margin-bottom: 2rem;
    }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 1rem; }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold-primary), #c4962c);
      color: #08090d;
      font-weight: 700;
      padding: 0.85rem 1.6rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 25px rgba(224, 184, 76, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(224, 184, 76, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 0.85rem 1.6rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(224, 184, 76, 0.1);
      border-color: var(--gold-primary);
    }

    .mandala-box {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      max-width: 440px;
      margin: 0 auto;
    }

    canvas#chakraCanvas {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 25px rgba(224, 184, 76, 0.25));
    }

    /* Section Styling */
    section {
      max-width: 1240px;
      margin: 0 auto;
      padding: 4.5rem 1.5rem;
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 1.5rem;
    }

    .section-header h2 {
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      color: var(--text-main);
    }

    /* Controls Bar (Search, Filter, Currency) */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      background: var(--bg-surface);
      padding: 1rem 1.25rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .pill {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill.active, .pill:hover {
      background: var(--gold-primary);
      color: #08090d;
      border-color: var(--gold-primary);
    }

    .search-currency {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    input[type="text"], select {
      background: var(--bg-obsidian);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.55rem 0.9rem;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--gold-primary);
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--gold-primary);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(224, 184, 76, 0.1);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold-primary);
      margin-bottom: 0.75rem;
      font-weight: 700;
    }

    .card-tag {
      background: rgba(224, 184, 76, 0.12);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
    }

    .card h3 {
      font-size: 1.25rem;
      margin-bottom: 0.65rem;
      color: #fff;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 1.25rem;
    }

    .card-footer {
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .price-box {
      display: flex;
      flex-direction: column;
    }

    .price-main {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--gold-primary);
    }

    .price-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .btn-demo {
      background: rgba(224, 184, 76, 0.14);
      color: var(--gold-primary);
      border: 1px solid var(--gold-primary);
      padding: 0.55rem 1rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-demo:hover {
      background: var(--gold-primary);
      color: #08090d;
    }

    /* Principles & Founder Grid */
    .three-col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .info-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
    }

    .info-box h3 {
      color: var(--gold-primary);
      margin-bottom: 0.6rem;
      font-size: 1.15rem;
    }

    /* Interactive Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 8, 0.85);
      backdrop-filter: blur(10px);
      display: none;
