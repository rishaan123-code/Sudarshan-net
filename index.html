<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sudarshan Net — Ancient Wisdom. Future Intelligence.</title>
  <meta name="description" content="Explore Sanatani knowledge and Indian intellectual traditions through thoughtful learning products, interactive tools, and modern technology." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#141413" />

  <!-- Editorial & Technical Typography -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FAF7F2;
      --bg-alt: #F1ECE1;
      --surface: #FFFFFF;
      --ink: #141413;
      --ink-muted: #524F4A;
      --accent: #C84B31;       /* Vermilion / Kumkum */
      --accent-dark: #9E351F;
      --brass: #9C7838;        /* Temple Brass */
      --border: #141413;
      --border-subtle: #D8D0C3;
      --shadow-hard: 4px 4px 0px #141413;
      --shadow-hover: 6px 6px 0px #141413;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Announcement Ticker */
    .top-bar {
      background: var(--ink);
      color: var(--bg);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      padding: 0.55rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .top-bar span.badge {
      background: var(--accent);
      color: #fff;
      padding: 0.15rem 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 2px solid var(--border);
    }
    .nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--ink);
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border: 2px solid var(--border);
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
      font-family: var(--font-serif);
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 2px 2px 0 var(--border);
    }
    .brand-title {
      font-family: var(--font-serif);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }
    .nav-links {
      display: flex;
      gap: 1.75rem;
      align-items: center;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      font-size: 0.92rem;
      position: relative;
    }
    .nav-links a:hover { color: var(--accent); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.4rem;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.95rem;
      border: 2px solid var(--border);
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: var(--shadow-hard);
    }
    .btn-primary:hover {
      background: var(--accent-dark);
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-hover);
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow-hard);
    }
    .btn-secondary:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-hover);
    }
    .btn-sm {
      padding: 0.5rem 0.95rem;
      font-size: 0.85rem;
      box-shadow: 2px 2px 0 var(--border);
    }

    /* Container */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Hero Section — Editorial Split Grid */
    .hero {
      border-bottom: 2px solid var(--border);
      background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 3rem;
      padding: 4.5rem 1.5rem;
      max-width: 1280px;
      margin: 0 auto;
      align-items: center;
    }
    @media (max-width: 920px) {
      .hero-grid { grid-template-columns: 1fr; padding: 3rem 1.5rem; }
    }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 1rem;
      display: inline-block;
      border: 1.5px solid var(--accent);
      padding: 0.2rem 0.6rem;
      background: var(--surface);
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.6rem, 5vw, 4.3rem);
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: -0.03em;
      margin-bottom: 1.35rem;
    }
    .hero-lead {
      font-size: 1.15rem;
      color: var(--ink-muted);
      max-width: 56ch;
      margin-bottom: 2rem;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .pwa-note {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--ink-muted);
    }

    /* Interactive Hero Workbench Card */
    .workbench {
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: 8px 8px 0 var(--border);
      padding: 1.5rem;
    }
    .workbench-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.75rem;
      margin-bottom: 1.15rem;
    }
    .workbench-title {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .wb-tabs {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    .wb-tab {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.35rem 0.65rem;
      border: 1.5px solid var(--border);
      background: var(--bg);
      cursor: pointer;
      font-weight: 600;
    }
    .wb-tab.active {
      background: var(--ink);
      color: #fff;
    }
    .wb-panel { display: none; }
    .wb-panel.active { display: block; }
    .wb-input {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 2px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      background: var(--bg);
    }
    .wb-output {
      background: var(--bg-alt);
      border: 1.5px solid var(--border);
      padding: 0.9rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      min-height: 82px;
    }

    /* Section Headings */
    section {
      padding: 4.5rem 0;
      border-bottom: 2px solid var(--border);
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }
    h2 {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 3.5vw, 2.9rem);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }

    /* Learning Pathways Interactive Selector */
    .path-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }
    @media (max-width: 820px) { .path-grid { grid-template-columns: 1fr; } }
    .path-card {
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 1.75rem;
      box-shadow: var(--shadow-hard);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .path-card:hover, .path-card.selected {
      background: var(--ink);
      color: var(--bg);
      transform: translate(-3px, -3px);
    }
    .path-num {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .path-card.selected .path-num, .path-card:hover .path-num { color: #F4A261; }
    .path-card h3 {
      font-family: var(--font-serif);
      font-size: 1.65rem;
      margin-bottom: 0.6rem;
    }

    /* Filter & Currency Bar */
    .toolbar {
      background: var(--bg-alt);
      border: 2px solid var(--border);
      padding: 1rem 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .filter-btn {
      padding: 0.45rem 0.9rem;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--accent);
      color: #fff;
    }

      display: flex;
