
<!-- SUDARSHAN NET — PREMIUM APP REDESIGN -->
<style>
:root {
  --sn-ink: #102638;
  --sn-deep: #071a29;
  --sn-gold: #d6a64d;
  --sn-paper: #f8f6f0;
  --sn-line: #e7e1d5;
  --sn-shadow: 0 12px 35px rgba(12,32,48,.07);
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--sn-paper) !important;
  color: var(--sn-ink);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif !important;
  -webkit-font-smoothing: antialiased;
}

.topbar {
  background: rgba(7,26,41,.97) !important;
  backdrop-filter: blur(20px);
  padding: 17px 5% !important;
  border-bottom: 1px solid rgba(214,166,77,.2);
  box-shadow: 0 4px 24px rgba(0,0,0,.08);
}

.brand {
  font-family: Georgia, serif;
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: .07em;
  color: #eac77d !important;
}

nav a {
  position: relative;
  font-weight: 500;
  transition: color .2s;
}

nav a:hover {
  color: #f1c878 !important;
}

.hero {
  min-height: 590px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background:
    radial-gradient(circle at 85% 30%,
      rgba(211,161,65,.14), transparent 33%),
    radial-gradient(circle at 15% 85%,
      rgba(31,102,124,.25), transparent 45%),
    linear-gradient(135deg,#071a29,#102f43) !important;
  position: relative;
}

.hero::after {
  content: "✺" !important;
  position: absolute;
  right: 6%;
  top: 12%;
  font-size: clamp(170px,28vw,370px);
  color: rgba(214,166,77,.10);
  animation: snRotate 45s linear infinite;
  pointer-events: none;
}

@keyframes snRotate {
  to { transform: rotate(360deg); }
}

.hero h1 {
  font-family: Georgia, serif;
  font-weight: 500;
  font-size: clamp(3.2rem,7vw,6.8rem);
  letter-spacing: -.045em;
  line-height: 1.08;
  max-width: 850px;
  color: #f4dfb0 !important;
}

.hero p {
  max-width: 650px;
  font-size: 1.08rem;
  line-height: 1.8;
}

.eyebrow {
  color: var(--sn-gold) !important;
  letter-spacing: .19em;
  font-size: .72rem;
}

.btn {
  border-radius: 12px !important;
  padding: 14px 23px !important;
  transition: transform .2s, box-shadow .2s;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0,0,0,.18);
}

.btn.primary {
  background: linear-gradient(135deg,#efcf86,#c7943c) !important;
  border: 0 !important;
  color: #102638 !important;
}

.wrap {
  max-width: 1280px;
  padding-top: 65px;
  padding-bottom: 65px;
}

.section-head h2 {
  font-size: clamp(2rem,4vw,3.2rem);
  letter-spacing: -.035em;
  font-weight: 500;
}

.grid {
  gap: 22px !important;
}

.card {
  position: relative;
  background: #fff !important;
  border: 1px solid var(--sn-line) !important;
  border-radius: 20px !important;
  padding: 24px !important;
  min-height: 295px;
  box-shadow: var(--sn-shadow) !important;
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
  overflow: hidden;
}

.card::before {
  content: "";
  height: 3px;
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  background: linear-gradient(90deg,
    #c7943c,#f2d89b,#c7943c);
  opacity: 0;
  transition: opacity .25s;
}

.card:hover {
  transform: translateY(-7px);
  box-shadow: 0 20px 45px rgba(12,32,48,.13) !important;
  border-color: #d6b77a !important;
}

.card:hover::before {
  opacity: 1;
}

.card .id {
  font-size: .7rem;
  letter-spacing: .16em;
}

.card h3 {
  font-size: 1.3rem;
  line-height: 1.3;
  letter-spacing: -.02em;
}

.card p {
  line-height: 1.7;
}

.card button,
.pay-ready,
.course-launch,
.reader-button {
  background: #102d40 !important;
  color: #fff !important;
  border-radius: 11px !important;
  padding: 12px 16px !important;
  font-weight: 650;
  transition: background .2s, transform .2s;
}

.card button:hover,
.course-launch:hover,
.reader-button:hover {
  background: #1d5268 !important;
  transform: translateY(-2px);
}

button:disabled {
  cursor: not-allowed !important;
  opacity: .55;
}

.pillrow {
  gap: 10px !important;
  margin: 28px 0 !important;
}

.pill {
  border-radius: 12px !important;
  padding: 10px 17px !important;
  background: #fff !important;
  transition: all .2s;
}

.pill.active,
.pill:hover {
  background: #102d40 !important;
  color: white !important;
}

.search {
  border-radius: 14px !important;
  padding: 16px 20px !important;
  box-shadow: 0 5px 18px rgba(0,0,0,.03);
  transition: border-color .2s, box-shadow .2s;
}

.search:focus {
  outline: none;
  border-color: var(--sn-gold);
  box-shadow: 0 0 0 4px rgba(214,166,77,.13);
}

.account-panel {
  background: linear-gradient(135deg,
    #fff,#f9f6ef) !important;
  border-radius: 22px !important;
  padding: 30px !important;
  box-shadow: var(--sn-shadow);
}

.account-panel input {
  border-radius: 11px !important;
  padding: 13px !important;
}

.account-panel button {
  border-radius: 11px !important;
  padding: 13px 20px !important;
}

.currency-bar {
  border-radius: 18px !important;
  padding: 22px !important;
  box-shadow: var(--sn-shadow);
}

.featureband {
  background: #f0e9dd !important;
}

.feature {
  border-left: 3px solid var(--sn-gold) !important;
  padding: 25px !important;
}

.callout {
  border-radius: 25px !important;
  padding: 45px !important;
  background:
    radial-gradient(circle at 90% 10%,
      rgba(214,166,77,.16),transparent 40%),
    #0b2638 !important;
}

#detail:not([hidden]) {
  border-radius: 22px !important;
  padding: 30px !important;
  box-shadow: 0 30px 100px rgba(0,0,0,.3) !important;
}

.checkout-box {
  border-radius: 15px !important;
  padding: 20px !important;
}

.reader-shell {
  border-radius: 24px !important;
}

footer {
  padding-top: 45px !important;
  padding-bottom: 45px !important;
}

.sn-reveal {
  animation: snReveal .55s ease both;
}

@keyframes snReveal {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media(max-width: 600px) {
  .hero {
    min-height: 520px;
    padding: 65px 22px !important;
  }

  .hero h1 {
    font-size: 3.2rem;
  }

  .topbar {
    padding: 14px 20px !important;
  }

  .wrap {
    padding: 45px 18px;
  }

  .card {
    min-height: 260px;
  }

  .account-panel {
    padding: 20px !important;
  }

  .callout {
    padding: 27px !important;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>

<script>
(function () {
  "use strict";

  function enhanceSudarshan() {
    // Enhance existing cards without modifying course data.
    document.querySelectorAll("#grid .card").forEach(
      (card, index) => {
        if (card.dataset.snEnhanced) return;
        card.dataset.snEnhanced = "true";
        card.classList.add("sn-reveal");
        card.style.animationDelay =
          Math.min(index, 8) * 45 + "ms";
      }
    );

    // Make the search feel more responsive.
    const search = document.getElementById("search");
    if (search && !search.dataset.snEnhanced) {
      search.dataset.snEnhanced = "true";
      search.setAttribute(
        "placeholder",
        "Discover courses, topics and ideas..."
      );
    }

    // Improve accessible labels.
    document.querySelectorAll("#grid .card button")
      .forEach(button => {
        if (!button.hasAttribute("aria-label")) {
          const title = button.closest(".card")
            ?.querySelector("h3")?.textContent;
          if (title) {
            button.setAttribute(
              "aria-label",
              "Explore " + title
            );
          }
        }
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded", enhanceSudarshan
    );
  } else {
    enhanceSudarshan();
  }

  // Reapply visual enhancements when filters redraw cards.
  const grid = document.getElementById("grid");
  if (grid) {
    let scheduled = false;
    const observer = new MutationObserver(() => {
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(() => {
        scheduled = false;
        enhanceSudarshan();
      });
    });
    observer.observe(grid, {
      childList: true
    });
  }
})();
</script>
<!-- END SUDARSHAN NET REDESIGN -->
